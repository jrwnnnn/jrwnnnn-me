name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v4

  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run astro:build

      - name: Prune dev dependencies
        run: npm prune --production

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jrwnnnn-me
          path: .

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [build, codeql]
    if: github.event_name == 'pull_request'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build, codeql]
    permissions:
      id-token: write
      contents: read

    if: github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: jrwnnnn-me

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_95A0651EBD314659A867C2845B6B7ABB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3BABF5E82ADA44A99885A9A4CECCEAFE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_72273CD7940D40EB8036FFAF805A422A }}

      - name: "Deploy to Azure"
        id: deploy-to-azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: "jrwnnnn"
          slot-name: "Production"
          package: .
          startup-command: "node ./dist/server/entry.mjs"
